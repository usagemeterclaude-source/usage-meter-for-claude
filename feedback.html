<style>
  :root { --bg: #f6f5f2; --fg: #1f1d1a; --muted: #6b665e; --line: #e3ded5; --card: #fff; --accent: #c96442; --accent-bg: #fdf1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #ece9e3; --muted: #a39d93; --line: #34312c; --card: #1f1d1a; --accent: #e08a6a; --accent-bg: #2c211c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, 'Segoe UI', sans-serif; line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 48px 16px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 8px 0 24px; }
  .cols { display: flex; gap: 28px; align-items: flex-start; }
  .cols > form { flex: 1; min-width: 0; }
  label.r { display: flex; gap: 10px; align-items: center; padding: 7px 0; cursor: pointer; }
  label.r input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
  textarea, input[type=email] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--card); color: var(--fg); margin-top: 12px; }
  textarea { height: 96px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { margin-top: 14px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 10px; color: var(--accent); min-height: 1.5em; }
  aside { width: 260px; flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; font-size: 14px; }
  aside b { display: block; margin-bottom: 6px; }
  .btn2 { display: inline-block; margin-top: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 7px 14px; font-weight: 600; text-decoration: none; }
  .done { background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 12px; padding: 22px; font-size: 17px; }
  .gift-note { color: var(--accent); font-weight: 600; margin: -14px 0 22px; }
  .gift { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .gift h2 { font-size: 19px; margin: 0 0 12px; }
  .code { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 14px; }
  .code b { font-family: Consolas, 'SF Mono', monospace; font-size: 24px; letter-spacing: 2px; padding: 6px 14px; border: 2px dashed var(--accent); border-radius: 8px; color: var(--accent); }
  .code button { margin: 0; }
  .how { color: var(--muted); font-size: 15px; margin: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) { .cols { flex-direction: column; } aside { width: 100%; } }
</style>
</head>

const q = new URLSearchParams(location.search);
const type = q.get('t') === 'idea' ? 'idea' : 'bye';

let lang = (q.get('l') || navigator.language || 'en').replace('-', '_');
if (!TX[lang]) lang = TX[lang.split('_')[0]] ? lang.split('_')[0] : (lang.startsWith('pt') ? 'pt_PT' : lang.startsWith('nb') || lang.startsWith('nn') ? 'no' : lang.startsWith('zh') ? 'zh_CN' : 'en');
const t = k => (TX[lang] && TX[lang][k]) || TX.en[k];

if (type === 'bye') {

  document.querySelectorAll('#reasons span').forEach((s, i) => { s.textContent = t('r' + (i + 1)); });

  if (type === 'idea' && text.length < 15) return void ($('msg').textContent = t('need_more'));
